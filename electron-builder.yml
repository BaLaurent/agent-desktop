appId: com.agent.desktop
productName: Agent Desktop
publish:
  - provider: github
    owner: BaLaurent
    repo: agent-desktop
    releaseType: release
directories:
  buildResources: build
  output: release
asar: false
files:
  - out
  - package.json
  - from: node_modules
    to: node_modules
    filter:
      - discord.js/**
      - "@discordjs/collection/**"
      - "@discordjs/ws/**"
      - "@discordjs/builders/**"
      - "@discordjs/formatters/**"
      - "@discordjs/util/**"
      - "@discordjs/rest/**"
      - "@sapphire/snowflake/**"
      - discord-api-types/**
      - fast-deep-equal/**
      - lodash.snakecase/**
      - magic-bytes.js/**
      - tslib/**
      - undici/**
      # Native STT addon (sherpa-onnx-node) + its per-platform prebuilt binaries.
      # esbuild can't inline a native .node, so these must ship unbundled. Only the
      # prebuild matching the target arch/os is present in node_modules at build time
      # (see scripts/fetch-sherpa-prebuilds.mjs); absent globs are silently skipped.
      # No win-arm64 prebuild exists upstream → Sherpa degrades gracefully there.
      - sherpa-onnx-node/**
      - sherpa-onnx-linux-x64/**
      - sherpa-onnx-linux-arm64/**
      - sherpa-onnx-win-x64/**
      - sherpa-onnx-darwin-arm64/**
      - sherpa-onnx-darwin-x64/**
      # onnxruntime-web (WASM) — served to the openWakeWord renderer worker via
      # agent-model://ort/. Not inlined; the wakeword 404s without it in packaged builds.
      - onnxruntime-web/**
extraResources:
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/trayDark.png
    to: trayDark.png
  - from: build/trayDark@2x.png
    to: trayDark@2x.png
  - from: build/trayLight.png
    to: trayLight.png
  - from: build/trayLight@2x.png
    to: trayLight@2x.png
  - from: resources/mcp/scheduler-server.mjs
    to: mcp/scheduler-server.mjs
  - from: resources/jupyter/bridge.py
    to: jupyter/bridge.py
  - from: resources/hotword/train_wakeword.py
    to: hotword/train_wakeword.py
  - from: resources/hotword-models
    to: hotword-models
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: out/headless/index.js
    to: headless/taskRunner.js
extraMetadata:
  main: ./out/main/index.js
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.productivity
  icon: build/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: "Agent Desktop uses the microphone for voice input transcription (via whisper.cpp). Audio is processed locally and never sent to any server."

linux:
  artifactName: "${name}-${version}-${arch}.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Utility
  maintainer: Agent Desktop Contributors
  desktop:
    MimeType: x-scheme-handler/agent
  synopsis: Open-source desktop client for Claude AI
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
